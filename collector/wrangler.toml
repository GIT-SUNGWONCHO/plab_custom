name = "plab-radar"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# 대시보드에서 넣은 변수(NTFY_TOKEN 등)를 배포 때 지우지 않음
keep_vars = true

# 매분 실행. 실제로 무엇을 가져올지는 src/schedule.ts의 적응형 주기가 결정.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "plab-radar"
database_id = "89a05da1-8e8d-4d74-a609-af14aedeebf8"
migrations_dir = "migrations"

# 매치 보드 화면(public/index.html)을 Worker 코드에 텍스트로 묶어서 배포
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# 앱 아이콘(PNG)은 바이너리로 묶음
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false

# 웹푸시 공개키 (공개돼도 되는 값. 개인키는 시크릿 VAPID_PRIVATE_JWK)
[vars]
VAPID_PUBLIC_KEY = "BLD8OcFGVCnJSd2giDFjO43Zo0ImnvvAgYjs00kYX7WVawYeWAQ1Vj7FWjGepb0WjDbo46arvzhkjyMM4cy5IqE"

[observability]
enabled = true
