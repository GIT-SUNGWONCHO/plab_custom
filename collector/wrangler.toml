name = "plab-radar"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 매분 실행. 실제로 무엇을 가져올지는 src/schedule.ts의 적응형 주기가 결정.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "plab-radar"
database_id = "89a05da1-8e8d-4d74-a609-af14aedeebf8"
migrations_dir = "migrations"

[observability]
enabled = true
