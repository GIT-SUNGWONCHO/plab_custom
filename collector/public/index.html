<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플랩레이더">
<title>플랩레이더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 플랩 웹의 토큰을 따름: Pretendard, 검정 + 라임 브랜드, 연회색 바탕, 얇은 테두리 */
:root {
  --bg: #ffffff; --surface: #ffffff; --muted: #f6f7f3; --border: #eaebe5;
  --fg: #0f1729; --fg-2: #4d5563; --fg-3: #65758b;
  --brand: #a6f56f; --brand-soft: #edf9e5; --brand-text: #36701a; --black: #171717; --on-black: #ffffff;
  --blue: #1570ff; --blue-soft: #ecf6ff; --red: #e5331c; --red-strong: #e5331c; --red-soft: #fff0ed; --sat: #1570ff; --sun: #ff4029;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #171717; --surface: #202020; --muted: #262626; --border: #2f2f2f;
  --fg: #ededed; --fg-2: #c4c4c4; --fg-3: #a0a0a0;
  --brand-soft: #20351b; --brand-text: #a6f56f; --black: #ededed; --on-black: #171717;
  --blue: #4492ff; --blue-soft: #14243d; --red: #ff6a55; --red-strong: #d92d18; --red-soft: #3a1d18; --sat: #4492ff; --sun: #ff6a55;
  color-scheme: dark } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; overflow-x: clip; touch-action: pan-y; -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: -0.01em;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 640px; margin: 0 auto }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { background: var(--bg); padding-top: env(safe-area-inset-top, 0px) }
.stick { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg) }
.bar { display: flex; align-items: center; gap: 8px; height: 52px }
.logo { font-weight: 800; font-size: 19px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 6px }
.logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft) }
.updated { margin-left: auto; font-size: 12px; color: var(--fg-3) }
.icon-btn { appearance: none; border: 0; background: var(--muted); color: var(--fg-2); width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer }

.dates { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px 10px; scrollbar-width: none }
.dates::-webkit-scrollbar { display: none }
.date { appearance: none; border: 0; background: transparent; color: var(--fg); min-width: 52px; padding: 6px 4px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font-family: inherit }
.date b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums }
.date span { font-size: 12px; color: var(--fg-3) }
.date.sat b, .date.sat span { color: var(--sat) }
.date.sun b, .date.sun span { color: var(--sun) }
.date[aria-pressed="true"] { background: var(--black) }
.date[aria-pressed="true"] b, .date[aria-pressed="true"] span { color: var(--on-black) }

.filters { display: flex; gap: 3px; align-items: center; padding-block: 0 10px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none }
.filters::-webkit-scrollbar { display: none }
.pill { display: inline-flex; align-items: center; gap: 1px; height: 28px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: 12px; color: var(--fg-3); white-space: nowrap; flex: none }
.pill { cursor: pointer }
.pill.toggle { appearance: none; font: inherit; font-size: 12px; font-weight: 500; color: var(--fg-3) }
.pill.toggle[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue) }
.pill .tilde { margin: 0 1px }
.pill .k { font-size: 12px; color: var(--fg-3); font-weight: 500 }
.sel { position: relative; display: inline-flex; align-items: center }
.sel select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 12px; font-weight: 500; color: var(--fg);
  padding: 0 9px 0 0; cursor: pointer; font-variant-numeric: tabular-nums }
.sel.bare select { padding-right: 0 }
.sel.bare::after { content: none }
.sel::after { content: "▾"; position: absolute; right: 0; pointer-events: none; font-size: 10px; color: var(--fg-3) }

.help { margin-top: 12px; border-radius: 12px; background: var(--muted) }
.help summary { cursor: pointer; padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--fg-2); list-style: none }
.help summary::-webkit-details-marker { display: none }
.help summary::after { content: " ▾"; color: var(--fg-3) }
.help[open] summary::after { content: " ▴" }
.help-body { padding: 0 12px 10px; font-size: 13px; color: var(--fg-2) }
.help-body p { margin: 0 0 8px }
.help-body b { color: var(--fg) }
.section { font-size: 13px; font-weight: 700; color: var(--fg-3); padding-block: 18px 6px }

ul.list { list-style: none; margin: 0; padding: 0 }
.row { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit }
.row:active { background: var(--muted) }
.time { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; align-self: start; padding-top: 1px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px }
.time small { display: block; font-size: 11px; font-weight: 500; color: var(--fg-3); margin-top: -2px }
.body { min-width: 0; display: flex; flex-direction: column; gap: 5px }
.title { font-weight: 600; font-size: 15px; word-break: keep-all; overflow-wrap: anywhere }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--fg-3) }
.tags .on { color: var(--fg-2); font-weight: 600 }
.tags .dot { color: var(--border) }
.tags { align-items: center }
.tags .badge { margin-left: 2px }
.badge { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; line-height: 1.4; white-space: nowrap }
.badge.ai { background: var(--blue-soft); color: var(--blue) }
.lv { position: relative; display: inline-flex; align-items: center; font-size: 13px; white-space: nowrap }
.lv > * { white-space: nowrap }
.lv .k { font-size: 12px; color: var(--fg-3) }
.lv b { font-weight: 700 }
.lvname { font-weight: 700; padding: 1px 5px; border-radius: 6px }
.lvname.good { background: var(--brand); color: #171717 }
.tier { position: absolute; top: -5px; right: -9px; font-size: 9px; line-height: 1; color: var(--fg-3) }
.tier.high { color: var(--red) }
.tier.low { color: var(--brand-text) }
.ppl { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.ppl.thin { color: var(--red) }
.status { text-align: center; min-width: 72px; height: 34px; line-height: 34px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 700; white-space: nowrap }
.status.available { background: var(--brand-soft); color: var(--brand-text) }
.status.hurry { background: var(--red-strong); color: #ffffff }
.status.full { background: var(--muted); color: var(--fg-3) }
.row.full .title, .row.full .time { color: var(--fg-3) }

.retry { appearance: none; margin-top: 12px; height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer }
.empty { padding: 40px 0; text-align: center; color: var(--fg-3) }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
.icon-btn { position: relative }
.icon-btn.on { background: var(--blue-soft); color: var(--blue) }
.icon-btn.on::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue) }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px }
.sheet h2 { margin: 0; font-size: 18px }
.sheet p, .sheet ol, .sheet .cond { word-break: keep-all }
.sheet p { margin: 0; font-size: 14px; color: var(--fg-2) }
.sheet .cond { background: var(--muted); border-radius: 12px; padding: 10px 12px; font-size: 14px }
.sheet .cond b { color: var(--fg) }
.sheet ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--fg-2) }
.sheet a { color: var(--blue) }
.topic { display: flex; gap: 6px; align-items: center }
.topic code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: var(--muted); border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--fg) }
.btns { display: flex; flex-direction: column; gap: 8px }
.btn { appearance: none; border: 0; border-radius: 12px; height: 46px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  background: var(--black); color: var(--on-black) }
.btn.sub { background: var(--muted); color: var(--fg); font-weight: 600 }
.btn.small { height: 36px; padding: 0 12px; font-size: 13px; flex: none }
.btn.danger { background: transparent; color: var(--red); font-weight: 600 }
.note { font-size: 13px; color: var(--fg-3); min-height: 18px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap gutter">
    <div class="bar">
      <div class="logo"><i></i>플랩레이더</div>
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="bell" type="button" aria-label="알림 설정">🔔</button>
      <button class="icon-btn" id="reload" type="button" aria-label="새로고침">↻</button>
    </div>
  </div>
</header>
<div class="stick">
  <div class="wrap gutter"><div class="dates" id="dates" role="tablist" aria-label="날짜"></div></div>
  <div class="wrap gutter filters">
    <div class="pill"><span class="sel bare"><select id="from" aria-label="시작 시간 부터"></select></span><span class="tilde">~</span><span class="sel"><select id="to" aria-label="시작 시간 까지"></select></span></div>
    <div class="pill"><span class="sel"><select id="sort" aria-label="정렬"><option value="rec">추천</option><option value="time">시간</option></select></span></div>
    <button class="pill toggle" id="v6" type="button" aria-pressed="false">6vs6</button>
    <button class="pill toggle" id="ai" type="button" aria-pressed="false" aria-label="AI리포트 매치만">AI</button>
    <button class="pill toggle" id="tf" type="button" aria-pressed="false">더에프</button>
    <button class="pill toggle" id="nofull" type="button" aria-pressed="false">마감제외</button>
  </div>
</div>

<main class="wrap gutter" id="main"></main>

<script>
const LV = ["루키","비기너1","비기너2","비기너3","아마추어1","아마추어2","아마추어3","아마추어4","아마추어5","세미프로1","세미프로2","세미프로3","프로"];
const short = (l) => (l || "").replace("아마추어", "아마").replace("세미프로", "세미");
const WD = ["일","월","화","수","목","금","토"];
const KEY = "plab-radar-board-v1";
// my: 내 레벨 (초록 표시 기준, 아마3 = 6)
let prefs = { v: 2, from: "10:00", to: "17:00", date: "", my: 6, sort: "rec", aiOnly: false, only6: false, onlyTF: false, hideFull: true };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  if (!saved.v) delete saved.hideFull; // v2부터 '마감 제외'가 기본값
  Object.assign(prefs, saved, { v: 2 });
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const times = []; for (let h = 0; h < 24; h++) times.push(String(h).padStart(2, "0") + ":00"); times.push("23:59");
const hourNum = (t) => (t === "23:59" ? "24" : String(Number(t.slice(0, 2))));
for (const t of times) { $("from").append(new Option(hourNum(t), t)); $("to").append(new Option(hourNum(t) + "시", t)); }
$("from").value = prefs.from; $("to").value = prefs.to; $("sort").value = prefs.sort;
$("ai").setAttribute("aria-pressed", String(prefs.aiOnly));
$("nofull").setAttribute("aria-pressed", String(prefs.hideFull));
$("v6").setAttribute("aria-pressed", String(prefs.only6));
$("tf").setAttribute("aria-pressed", String(prefs.onlyTF));

function kstToday() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function dday(iso) {
  if (!iso) return "";
  const ms = Date.parse(iso) - Date.now();
  if (ms <= 0) return "마감";
  const h = Math.floor(ms / 3600e3);
  // 하루 이상 남았으면 모든 카드가 같아서 표시 안 함 (경기 당일에만 의미 있음)
  return h >= 24 ? "" : h >= 1 ? `마감 ${h}시간 전` : `마감 ${Math.ceil(ms / 60e3)}분 전`;
}
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60e3);
  return m < 1 ? "방금 갱신" : m < 60 ? `${m}분 전 갱신` : `${Math.round(m / 60)}시간 전 갱신`;
}

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function renderDates(dates) {
  const today = kstToday();
  const list = dates.filter((d) => d.date >= today);
  if (!list.some((d) => d.date === prefs.date)) {
    const sun = list.find((d) => new Date(d.date + "T00:00:00Z").getUTCDay() === 0);
    prefs.date = (sun || list[0] || { date: today }).date;
  }
  $("dates").innerHTML = list.map((d) => {
    const dt = new Date(d.date + "T00:00:00Z"); const w = dt.getUTCDay();
    return `<button class="date${w === 6 ? " sat" : w === 0 ? " sun" : ""}" type="button" role="tab" data-date="${d.date}" aria-pressed="${d.date === prefs.date}">
      <b>${dt.getUTCDate()}</b><span>${d.date === today ? "오늘" : WD[w]}</span></button>`;
  }).join("");
  const sel = $("dates").querySelector('[aria-pressed="true"]'); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

function levelHtml(it) {
  const e = it.estimate;
  if (!e) return `<div class="lv"><span class="k" aria-label="평균 없음">–</span></div>`;
  const L = short(e.label);
  // 레벨 안 위치: ▲ 높은 쪽 · ● 가운데 · ▼ 낮은 쪽 · 모르면 표시 안 함
  const pos = e.narrowed ? { low: ["▼", "낮은 쪽"], mid: ["●", "가운데"], high: ["▲", "높은 쪽"] }[e.tier] : null;
  // 초록: 내 레벨보다 낮거나, 내 레벨과 같은데 높은 쪽이 아닌 매치만
  const good = it.atOrBelowMine;

  return `<div class="lv"><b class="lvname${good ? " good" : ""}">${esc(L)}</b>${pos ? `<span class="tier ${e.tier}" role="img" aria-label="${esc(L)} 중 ${pos[1]}" title="${esc(L)} 중 ${pos[1]}">${pos[0]}</span>` : ""}</div>`;
}
function rowHtml(it) {
  const status = it.full ? ["full", "마감"] : it.closingSoon ? ["hurry", "마감임박"] : ["available", "신청가능"];
  const tags = [
    `<span class="${it.is6v6 ? "on" : ""}">${esc((it.format || "").replace(/\s/g, ""))}</span>`,
    it.sex === 1 ? `<span>남자</span>` : `<span>남녀 모두</span>`,
  ].filter(Boolean).join(`<span class="dot">·</span>`) + (it.aiReport ? `<span class="badge ai">AI리포트</span>` : "");
  return `<li><a class="row${it.full ? " full" : ""}" href="${esc(it.url)}" target="_blank" rel="noopener">
    <div class="time"><span>${esc(it.time)}${(() => { const d = it.full ? "" : dday(it.deadlineAt); return d ? `<small>${esc(d)}</small>` : ""; })()}</span>${levelHtml(it)}</div>
    <div class="body">
      <div class="title">${esc(it.title)}</div>
      <div class="tags">${tags}</div>
      <div class="ppl${it.confirm > 0 && !it.enoughPlayers ? " thin" : ""}">신청 ${it.confirm}/${it.max ?? "?"}명</div>
    </div>
    <div class="status ${status[0]}">${status[1]}</div></a></li>`;
}

let last = null;
function render(data) {
  last = data;
  $("updated").textContent = ago(data.updated_at);
  renderDates(data.dates);
  // 추천순은 서버 정렬 그대로, 시간순은 시작 시각 → 구장명
  const base = data.items.filter((x) => (!prefs.aiOnly || x.aiReport) && (!prefs.only6 || x.is6v6) && (!prefs.onlyTF || x.title.includes("더에프필드")) && (!prefs.hideFull || !x.full));
  const items = prefs.sort === "time"
    ? [...base].sort((a, b) => a.time.localeCompare(b.time) || a.title.localeCompare(b.title))
    : base;
  if (!items.length) { $("main").innerHTML = HELP + `<p class="empty">이 날짜·시간대에 조건에 맞는 매치가 없어요.</p>`; const h0 = $("help"); h0.open = helpOpen; h0.ontoggle = () => { helpOpen = h0.open; }; return; }
  $("main").innerHTML =
    HELP +
    `<ul class="list">${items.map(rowHtml).join("")}</ul>`;
  const h = $("help"); h.open = helpOpen; h.ontoggle = () => { helpOpen = h.open; };
}
let helpOpen = false;

const HELP = `<details class="help" id="help"><summary>정렬 순서 · 보는 법</summary><div class="help-body">
  <p><b>추천순</b> 평균 아마3 이하(초록) 매치 먼저, 그다음 나머지. 각각 마감임박 → 이른 시각 순 (같은 시각이면 레벨 낮은 순 → 6vs6 → 신청 10명 이상).</p>
  <p><b>6vs6 · AI(리포트) · 더에프 버튼</b> 누르면 그 매치만 보여요 (더에프 = 영등포 더에프필드). 여러 개 켜면 모두 해당하는 매치만.</p>
  <p><b>마감 제외 버튼</b> 기본으로 켜져 있어 마감된 매치를 숨겨요. 끄면 마감 매치도 같은 순서 안에 섞여 보여요.</p>
  <p><b>시간순</b> 시작 시각 순.</p>
  <p><b>마감임박</b> 신청 15명 이상.</p>
  <p><b>평균 레벨 (시간 아래)</b> 플랩이 보여주는 참가자 평균 레벨 (루키 제외, 반올림 값). 아마3이면 실제 평균은 2.5~3.5 사이. 평가된 신청자가 없으면 –.</p>
  <p><b>▲ ● ▼</b> 그 2.5~3.5 안에서 추정한 평균 범위의 가운데가 3.0보다 위 / 거의 3.0 / 아래라는 뜻.
    사람이 들고 날 때 평균 표시가 바뀐 기록으로 계산해요.</p>
  <p><b>아이콘 없음</b> 평균 표시가 한 번도 안 바뀌어서 2.5~3.5 중 어디인지 알 수 없는 매치. 정렬할 땐 가운데로 쳐요.</p>
  <p><b>빨간 신청 인원</b> 1~9명. 한 명만 들어와도 평균이 크게 흔들려요.</p>
  <p><b>초록 레벨</b> 평균이 아마3 이하인 매치 (아마3 중 높은 쪽 ▲은 제외).</p>
  <p><b>마감 3시간 전</b> 신청 마감(경기 10분 전)까지 남은 시간. 마감 24시간 이내일 때만 보여요.</p>
  <p><b>AI리포트</b> 플랩이 경기 후 AI 분석 리포트를 주는 매치.</p>
</div></details>`;

let seq = 0;
async function load() {
  const my = ++seq;
  if (!last) $("main").innerHTML = `<p class="empty">불러오는 중…</p>`;
  try {
    let data = await api(`/api/board?date=${prefs.date || kstToday()}&from=${prefs.from}&to=${prefs.to}&my=${prefs.my}`);
    if (my !== seq) return;
    const before = prefs.date; renderDates(data.dates);
    if (prefs.date !== before) data = await api(`/api/board?date=${prefs.date}&from=${prefs.from}&to=${prefs.to}&my=${prefs.my}`);
    if (my !== seq) return;
    save(); render(data);
  } catch (e) {
    if (my !== seq) return;
    $("main").innerHTML = `<div class="empty">매치를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.<br><button class="retry" id="retry" type="button">다시 시도</button></div>`;
    $("retry").onclick = load;
  }
}

$("dates").addEventListener("click", (e) => { const b = e.target.closest(".date"); if (!b) return; prefs.date = b.dataset.date; save(); load(); });
$("from").onchange = (e) => { prefs.from = e.target.value; if (prefs.from > prefs.to) { prefs.to = prefs.from; $("to").value = prefs.to; } save(); load(); };
$("to").onchange = (e) => { prefs.to = e.target.value; if (prefs.to < prefs.from) { prefs.from = prefs.to; $("from").value = prefs.from; } save(); load(); };
$("sort").onchange = (e) => { prefs.sort = e.target.value; save(); if (last) render(last); };
$("tf").onclick = () => { prefs.onlyTF = !prefs.onlyTF; $("tf").setAttribute("aria-pressed", String(prefs.onlyTF)); save(); if (last) render(last); };
$("v6").onclick = () => { prefs.only6 = !prefs.only6; $("v6").setAttribute("aria-pressed", String(prefs.only6)); save(); if (last) render(last); };
$("nofull").onclick = () => { prefs.hideFull = !prefs.hideFull; $("nofull").setAttribute("aria-pressed", String(prefs.hideFull)); save(); if (last) render(last); };
$("ai").onclick = () => { prefs.aiOnly = !prefs.aiOnly; $("ai").setAttribute("aria-pressed", String(prefs.aiOnly)); save(); if (last) render(last); };
$("reload").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

// ---------- 알림 (ntfy) ----------
let alertSub = null;
function ensureTopic() {
  if (!prefs.topic) {
    const a = new Uint8Array(12); crypto.getRandomValues(a);
    prefs.topic = "plabradar-" + [...a].map((b) => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
    save();
  }
  return prefs.topic;
}
function fmtDate(d) { const dt = new Date(d + "T00:00:00Z"); return `${dt.getUTCMonth() + 1}/${dt.getUTCDate()}(${WD[dt.getUTCDay()]})`; }
function condText(c) {
  const t = (x) => (x === "23:59" ? "24" : String(Number(x.slice(0, 2))));
  const opts = [c.only6 && "6vs6만", c.onlyAI && "AI리포트만", c.onlyTF && "더에프만"].filter(Boolean).join(" · ");
  return `<b>${fmtDate(c.date)} · ${t(c.from)}~${t(c.to)}시</b>${opts ? " · " + opts : ""}`;
}
const currentCond = () => ({ date: prefs.date, from: prefs.from, to: prefs.to, only6: prefs.only6, onlyAI: prefs.aiOnly, onlyTF: prefs.onlyTF });
const subCond = (s) => ({ date: s.date, from: s.time_from, to: s.time_to, only6: !!s.only6, onlyAI: !!s.only_ai, onlyTF: !!s.only_tf });
async function refreshBell() {
  if (!prefs.topic) { $("bell").classList.remove("on"); return; }
  try { alertSub = await (await fetch(`/api/alerts?topic=${prefs.topic}`)).json(); } catch (e) { alertSub = null; }
  $("bell").classList.toggle("on", !!alertSub);
}
function openSheet() {
  const topic = ensureTopic();
  const cur = currentCond();
  const same = alertSub && JSON.stringify(subCond(alertSub)) === JSON.stringify({ ...cur, only6: !!cur.only6, onlyAI: !!cur.onlyAI, onlyTF: !!cur.onlyTF });
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title">알림 받기</h2>
    <p>조건 안의 <b>평균 아마3 이하</b> 매치가 <b>신청 10명</b>을 넘거나 <b>마감임박(15명+)</b>이 되면 휴대폰으로 알려드려요. 밤 12시~아침 8시엔 쉬고 8시에 몰아서 보내요.</p>
    ${alertSub ? `<div class="cond">지금 받는 조건: ${condText(subCond(alertSub))}</div>` : ""}
    ${alertSub && same ? "" : `<div class="cond">${alertSub ? "바꿀 조건(지금 화면 필터)" : "알림 조건(지금 화면 필터)"}: ${condText(cur)}</div>`}
    ${alertSub ? "" : `<ol>
      <li>휴대폰에 <b>ntfy</b> 앱을 설치해요. <a href="https://apps.apple.com/app/ntfy/id1625396347" target="_blank" rel="noopener">아이폰</a> · <a href="https://play.google.com/store/apps/details?id=io.heckel.ntfy" target="_blank" rel="noopener">안드로이드</a></li>
      <li>앱에서 <b>+</b>를 누르고, 토픽 이름에 아래 글자를 붙여넣고 <b>Subscribe</b>를 눌러요.</li>
      <li>아래 <b>알림 켜기</b>를 누르고, <b>테스트 알림</b>이 오는지 확인해요.</li>
    </ol>`}
    <div class="topic"><code id="topic-text">${esc(topic)}</code><button class="btn sub small" id="copy-topic" type="button">복사</button></div>
    <div class="btns">
      ${alertSub && same ? "" : `<button class="btn" id="alert-on" type="button">${alertSub ? "이 조건으로 바꾸기" : "알림 켜기"}</button>`}
      ${alertSub ? `<button class="btn sub" id="alert-test" type="button">테스트 알림 보내기</button>
      <button class="btn danger" id="alert-off" type="button">알림 끄기</button>` : ""}
      <button class="btn sub" id="sheet-close" type="button">닫기</button>
    </div>
    <p class="note" id="sheet-note" aria-live="polite"></p>
  </div>`;
  document.body.append(bg);
  const close = () => bg.remove();
  const note = (t) => { $("sheet-note").textContent = t; };
  bg.addEventListener("click", (e) => { if (e.target === bg) close(); });
  $("sheet-close").onclick = close;
  $("copy-topic").onclick = async () => {
    try { await navigator.clipboard.writeText(topic); note("토픽 이름을 복사했어요. ntfy 앱에 붙여넣어 주세요."); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("topic-text")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); note("글자를 길게 눌러 복사해 주세요."); }
  };
  const on = $("alert-on");
  if (on) on.onclick = async () => {
    on.disabled = true; note("저장하는 중…");
    const res = await fetch("/api/alerts", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ topic, ...cur }) }).catch(() => null);
    if (!res || !res.ok) { on.disabled = false; note("저장하지 못했어요. 잠시 후 다시 시도해 주세요."); return; }
    await refreshBell(); close(); openSheet(); $("sheet-note").textContent = "알림을 켰어요. 테스트 알림으로 확인해 보세요.";
  };
  const test = $("alert-test");
  if (test) test.onclick = async () => {
    test.disabled = true; note("보내는 중…");
    const res = await fetch("/api/alerts/test", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ topic }) }).catch(() => null);
    const body = res ? await res.json().catch(() => ({})) : {};
    note(res && res.ok ? "보냈어요. ntfy 앱에 알림이 왔는지 확인해 주세요." : body.error || "보내지 못했어요. 잠시 후 다시 시도해 주세요.");
    setTimeout(() => { test.disabled = false; }, 3000);
  };
  const off = $("alert-off");
  if (off) off.onclick = async () => {
    await fetch(`/api/alerts?topic=${topic}`, { method: "DELETE" }).catch(() => null);
    await refreshBell(); close();
  };
}
$("bell").onclick = openSheet;
refreshBell();
load();
</script>
</body>
</html>
