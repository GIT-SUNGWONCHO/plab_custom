<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플랩레이더">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>플랩레이더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 플랩 웹의 토큰을 따름: Pretendard, 검정 + 라임 브랜드, 연회색 바탕, 얇은 테두리 */
:root {
  --bg: #ffffff; --surface: #ffffff; --muted: #f6f7f3; --border: #eaebe5;
  --fg: #0f1729; --fg-2: #4d5563; --fg-3: #65758b;
  --brand: #a6f56f; --brand-soft: #edf9e5; --brand-text: #36701a; --black: #171717; --on-black: #ffffff;
  --blue: #0f62e6; --blue-soft: #ecf6ff; --red: #d0281a; --red-strong: #d0281a; --red-soft: #fff0ed; --sat: #1570ff; --sun: #ff4029;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #171717; --surface: #202020; --muted: #262626; --border: #2f2f2f;
  --fg: #ededed; --fg-2: #c4c4c4; --fg-3: #a0a0a0;
  --brand-soft: #20351b; --brand-text: #a6f56f; --black: #ededed; --on-black: #171717;
  --blue: #4492ff; --blue-soft: #14243d; --red: #ff6a55; --red-strong: #d92d18; --red-soft: #3a1d18; --sat: #4492ff; --sun: #ff6a55;
  color-scheme: dark } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; overflow-x: clip; touch-action: pan-y; -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: -0.01em;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 640px; margin: 0 auto }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { background: var(--bg); padding-top: env(safe-area-inset-top, 0px) }
.stick { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg) }
.bar { display: flex; align-items: center; gap: 8px; height: 52px }
.logo { font-weight: 800; font-size: 19px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 6px }
.logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft) }
.updated { margin-left: auto; font-size: 12px; color: var(--fg-3) }
.icon-btn { appearance: none; border: 0; background: var(--muted); color: var(--fg-2); width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; padding: 0 }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

.dates { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px 10px; scrollbar-width: none }
.dates::-webkit-scrollbar { display: none }
.date { appearance: none; border: 0; background: transparent; color: var(--fg); min-width: 52px; padding: 6px 4px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font-family: inherit }
.date b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums }
.date span { font-size: 12px; color: var(--fg-3) }
.date.sat b, .date.sat span { color: var(--sat) }
.date.sun b, .date.sun span { color: var(--sun) }
.date[aria-pressed="true"] { background: var(--black) }
.date[aria-pressed="true"] b, .date[aria-pressed="true"] span { color: var(--on-black) }

.filters { display: flex; gap: 3px; align-items: center; padding-block: 0 10px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none }
.filters::-webkit-scrollbar { display: none }
.pill { display: inline-flex; align-items: center; gap: 1px; height: 30px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: 12px; color: var(--fg-3); white-space: nowrap; flex: none }
.pill { cursor: pointer }
.filters > .pill { flex: 1 1 auto; justify-content: center }
.pill.toggle { appearance: none; font: inherit; font-size: 11.5px; font-weight: 500; letter-spacing: -0.02em; padding: 0 5.5px; color: var(--fg-3) }
#minp-pill.on, #minp-pill.on .sel select { color: var(--blue) }
#minp-pill.on { background: var(--blue-soft); border-color: var(--blue) }
.pill.toggle[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue) }
.pill .tilde { margin: 0 }
.pill .k { font-size: 12px; color: var(--fg-3); font-weight: 500 }
.sel { position: relative; display: inline-flex; align-items: center }
.sel select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 11.5px; height: 28px; line-height: 28px; font-weight: 500; color: var(--fg); letter-spacing: -0.02em;
  padding: 0 7px 0 0; cursor: pointer; font-variant-numeric: tabular-nums }
.sel.bare select { padding-right: 0 }
.sel.bare::after { content: none }
.sel::after { content: "▾"; position: absolute; right: 0; pointer-events: none; font-size: 10px; color: var(--fg-3) }

.intro { margin-top: 12px; padding: 14px 14px 12px; border-radius: 14px; background: var(--brand-soft); display: flex; flex-direction: column; gap: 8px }
.intro h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--fg) }
.intro ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--fg-2); word-break: keep-all }
.intro ol b { color: var(--fg) }
.intro .btn { align-self: flex-end }
.help { margin-top: 12px; border-radius: 12px; background: var(--muted) }
.help summary { cursor: pointer; padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--fg-2); list-style: none }
.help summary::-webkit-details-marker { display: none }
.help summary::after { content: " ▾"; color: var(--fg-3) }
.help[open] summary::after { content: " ▴" }
.help-body { padding: 0 12px 10px; font-size: 13px; color: var(--fg-2); word-break: keep-all }
.help-body p { margin: 0 0 8px }
.help-body b { color: var(--fg) }
.help-body h4 { margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--fg-3) }
.help-body h4:first-child { margin-top: 0 }
.tier-inline { display: inline-block; width: 9px; height: 9px; vertical-align: 1px; color: var(--fg-3) }
.tier-inline svg { width: 9px; height: 9px; fill: currentColor; display: block }
.tier-inline.high { color: var(--red) } .tier-inline.low { color: var(--brand-text) }
.section { font-size: 13px; font-weight: 700; color: var(--fg-3); padding-block: 18px 6px }

ul.list { list-style: none; margin: 0; padding: 0 }
.row { display: grid; grid-template-columns: 72px 1fr auto; gap: 12px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit }
.row:active { background: var(--muted) }
.time { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; align-self: start; padding-top: 1px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px }
.time small { display: block; font-size: 11px; font-weight: 500; color: var(--fg-3); margin-top: -2px }
.body { min-width: 0; display: flex; flex-direction: column; gap: 5px }
.title { font-weight: 600; font-size: 15px; word-break: keep-all; overflow-wrap: anywhere }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--fg-3) }
.tags .on { color: var(--fg-2); font-weight: 600 }
.tags .dot { color: var(--fg-3); opacity: .55 }
.tags { align-items: center }
.tags .badge { margin-left: 2px }
.badge { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; line-height: 1.4; white-space: nowrap }
.badge.ai { background: var(--blue-soft); color: var(--blue) }
.lv { position: relative; display: inline-flex; align-items: center; font-size: 13px; white-space: nowrap }
.lv > * { white-space: nowrap }
.lv .k { font-size: 12px; color: var(--fg-3) }
.lv b { font-weight: 700 }
.lvname { font-weight: 700; padding: 1px 5px; border-radius: 6px; background: var(--muted); color: var(--fg-2) }
.lv::before { content: ""; position: absolute; inset: -10px -14px -8px }
.lvname.good { background: var(--brand); color: #171717 }
.tier { position: absolute; top: -5px; right: -9px; width: 9px; height: 9px; line-height: 0; color: var(--fg-3) }
.tier svg { width: 9px; height: 9px; fill: currentColor; display: block }
.tier.high { color: var(--red) }
.tier.low { color: var(--brand-text) }
.ppl { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.ppl { display: flex; align-items: center; gap: 8px }
/* 신청 인원 막대: 1~9명 회색 · 10~14명 초록 · 15명+ 빨강(마감임박과 같은 색). 글자는 굵게 하지 않음 */
.ppl .bar { flex: 0 0 64px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden }
.ppl .bar i { display: block; height: 100%; background: var(--fg-3) }
.ppl.enough .bar i { background: var(--brand-text) }
.ppl.hot { color: var(--red) }
.ppl.hot .bar i { background: var(--red) }
.row.full .ppl { color: var(--fg-3) }
.row.full .ppl .bar i { background: var(--fg-3) }
.row { cursor: pointer }
a.status { text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 3px }
.status .ext { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .8 }
.title .chev { margin-left: 4px; color: var(--fg-3); font-weight: 400 }
a.btn { display: flex; align-items: center; justify-content: center; text-decoration: none }
.status { text-align: center; min-width: 72px; height: 34px; line-height: 34px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 700; white-space: nowrap }
.status.available { background: var(--brand-soft); color: var(--brand-text) }
.status.hurry { background: var(--red-strong); color: #ffffff }
.status.full { background: var(--muted); color: var(--fg-3) }
.row.full .title, .row.full .time { color: var(--fg-3) }

.retry { appearance: none; margin-top: 12px; height: 36px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer }
.empty { padding: 40px 0; text-align: center; color: var(--fg-3); word-break: keep-all }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
.icon-btn { position: relative }
.icon-btn.on { background: var(--blue-soft); color: var(--blue) }
.icon-btn.on::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--blue) }
.sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center }
.sheet { width: 100%; max-width: 640px; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px }
.sheet h2 { margin: 0; font-size: 18px; word-break: keep-all; overflow-wrap: anywhere }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.sheet-head .x-btn { flex: none }
.sheet .cond.cur { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.sheet .link { appearance: none; border: 0; background: none; padding: 4px 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--blue); white-space: nowrap; cursor: pointer }
.sheet .link:disabled { color: var(--fg-3) }
.sheet p, .sheet ol, .sheet .cond { word-break: keep-all }
.sheet p { margin: 0; font-size: 14px; color: var(--fg-2) }
.sheet .cond { background: var(--muted); border-radius: 12px; padding: 10px 12px; font-size: 14px }
.sheet .cond b { color: var(--fg) }
.sheet ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--fg-2) }
.sheet a { color: var(--blue) }
.btns { display: flex; flex-direction: column; gap: 8px }
.btn { flex: none; appearance: none; border: 0; border-radius: 12px; height: 46px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  background: var(--black); color: var(--on-black) }
.btn.sub { background: var(--muted); color: var(--fg); font-weight: 600 }
.btn.small { height: 36px; padding: 0 12px; font-size: 13px; flex: none }
.btn.danger { background: transparent; color: var(--red); font-weight: 600 }
.note { font-size: 13px; color: var(--fg-3); min-height: 18px }
.sheet .hint { display: block; font-size: 12px; color: var(--fg-3); margin-top: 6px }
.sheet .cond ol { margin-top: 8px }
.lv { cursor: pointer }
.hist-head { flex: none; padding-bottom: 4px;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start }
.hist-head h2 { grid-column: 1 }
.hist-head .sub { grid-column: 1 }
.x-btn { grid-column: 2; grid-row: 1 / span 2; appearance: none; border: 0; background: var(--muted); color: var(--fg-2); width: 34px; height: 34px;
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer }
/* 추이 팝업: 위(제목·✕) 고정 / 가운데만 스크롤 / 아래(닫기) 고정 */
.sheet.hist { overflow: hidden; gap: 10px }
.hist-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain }
.hist-foot { flex: none; padding-top: 4px; border-top: 1px solid var(--border) }
.hist-foot .btn { width: 100% }
.hist-log summary { cursor: pointer; list-style: none; font-size: 13px; font-weight: 600; color: var(--fg-2); padding: 8px 0 }
.hist-log summary::-webkit-details-marker { display: none }
.hist-log summary::after { content: " ▾"; color: var(--fg-3) }
.hist-log[open] summary::after { content: " ▴" }
.hist-head .sub { font-size: 13px; color: var(--fg-3); word-break: keep-all }
.hist-head .sub b { color: var(--fg); font-weight: 700 }
.chart-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 18px }
.readout { font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; white-space: nowrap }
.readout b { color: var(--fg) }
.chart { display: flex; flex-direction: column; gap: 4px }
.blk { display: flex; flex-direction: column; gap: 10px; padding-top: 14px; border-top: 1px solid var(--border) }
.blk:first-child { border-top: 0; padding-top: 2px }
.bh { margin: 0; font-size: 15px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 6px }
.bh .tag { font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: var(--muted); color: var(--fg-3) }
.blk .hint { margin: 0; font-size: 11.5px; color: var(--fg-3); word-break: keep-all }
.lvnow { display: flex; align-items: baseline; gap: 8px }
.lvnow .big { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums }
.lvnow .cap { font-size: 12px; color: var(--fg-3) }
.gauge { display: grid; grid-template-columns: 14px 1fr 14px; gap: 4px 8px; align-items: center; font-size: 11px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.gauge .ge { text-align: center }
.gauge .gt { position: relative; display: grid; grid-template-columns: 3fr 4fr 3fr; gap: 2px; height: 10px }
.gauge .gt i { background: var(--fg-3); border-radius: 2px }
.gauge .gt i.top { background: var(--brand); opacity: 1 }
.gauge .gt b { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--fg); border: 2px solid var(--surface) }
.gauge .gl { display: grid; grid-template-columns: 3fr 4fr 3fr; text-align: center }
.gauge .gl b { color: var(--fg); font-weight: 700 }
.heat { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.heat li { display: grid; grid-template-columns: 76px 1fr; gap: 8px; align-items: center; font-size: 12px }
.gn { color: var(--fg-2); white-space: nowrap }
.gn b { color: var(--fg); font-weight: 600 }
.muted { color: var(--fg-3); font-size: 11.5px }
.cells { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px }
.cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px }
.cell i { position: absolute; inset: 0 0 16px; border-radius: 5px; background: var(--brand) }
.cell em { position: relative; height: 26px; line-height: 26px; font-style: normal; font-size: 11px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums }
.cell.hi em { color: #171717 }
.cell small { font-size: 10.5px; color: var(--fg-3) }
.hist-lv { list-style: none; margin: 0; padding: 0; display: flex; gap: 5px }
.hist-lv li { flex: 1 1 0; max-width: 40px; min-width: 0; display: flex; flex-direction: column; gap: 4px }
.hist-lv .hc { height: 96px; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; gap: 3px }
.hist-lv .hn { text-align: center; font-size: 12px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1 }
.hist-lv .hb { border-radius: 5px 5px 2px 2px; min-height: 6px }
.hist-lv .hl { text-align: center; font-size: 10.5px; color: var(--fg-3); white-space: nowrap; letter-spacing: -0.04em }
.hist-lv .g-r .hb { background: repeating-linear-gradient(135deg, var(--fg-3) 0 2px, transparent 2px 6px); opacity: .55 }
.hist-lv .g-r .hn { color: var(--fg-3) }
.hist-lv .g-b .hb { background: var(--fg-3); opacity: .45 }
.hist-lv .g-a .hb { background: var(--fg-3) }
.hist-lv .g-s .hb { background: var(--fg-2) }
.hist-lv .g-p .hb { background: var(--fg) }
.hist-lv .avg .hb { background: var(--brand); opacity: 1 }
.hist-lv .avg .hb.stub { height: 4px; min-height: 4px; border-radius: 2px }
.hist-lv .avg .hl { color: var(--fg); font-weight: 700 }
.pdetail summary { cursor: pointer; list-style: none; font-size: 12.5px; font-weight: 600; color: var(--fg-2); padding: 2px 0 }
.pdetail summary::-webkit-details-marker { display: none }
.pdetail summary::after { content: " ▾"; color: var(--fg-3) }
.pdetail[open] summary::after { content: " ▴" }
.pdetail[open] { display: flex; flex-direction: column; gap: 10px }
.chart h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--fg-3) }
.chart svg { display: block; width: 100%; touch-action: none; overflow: visible }
.chart .grid { stroke: var(--border); stroke-width: 1 }
.chart .vgrid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 3 }
.chart .vgrid.major { stroke-dasharray: none }
.chart .axis.day { fill: var(--fg-2); font-weight: 600 }
.chart .axis { fill: var(--fg-3); font-size: 10px; font-family: var(--font) }
.chart .line { fill: none; stroke: var(--fg); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round }
.chart .area { fill: var(--muted) }
.chart .dot { fill: var(--fg); stroke: var(--surface); stroke-width: 2 }
.chart .cross { stroke: var(--fg-3); stroke-width: 1; stroke-dasharray: 3 3 }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; border-top: 1px solid var(--border) }
.log li { display: grid; grid-template-columns: auto auto auto 1fr; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); white-space: nowrap }
.log li span:first-child { color: var(--fg-3) }
.log .chg { color: var(--fg); font-weight: 700 }
.log .who { text-align: right; font-size: 12px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.log .who b { color: var(--fg-2); font-weight: 600 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap gutter">
    <div class="bar">
      <div class="logo"><i></i>플랩레이더</div>
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="bell" type="button" aria-label="알림 설정"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button class="icon-btn" id="reload" type="button" aria-label="새로고침"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
  </div>
</header>
<div class="stick">
  <div class="wrap gutter"><div class="dates" id="dates" role="tablist" aria-label="날짜"></div></div>
  <div class="wrap gutter filters">
    <div class="pill"><span class="sel bare"><select id="from" aria-label="시작 시간 부터"></select></span><span class="tilde">~</span><span class="sel"><select id="to" aria-label="시작 시간 까지"></select></span></div>
    <div class="pill"><span class="sel"><select id="sort" aria-label="정렬"><option value="rec">추천</option><option value="time">시간</option></select></span></div>
    <button class="pill toggle" id="ai" type="button" aria-pressed="false" aria-label="AI리포트 매치만">AI</button>
    <button class="pill toggle" id="v6" type="button" aria-pressed="false">6vs6</button>
    <div class="pill" id="minp-pill"><span class="sel"><select id="minp" aria-label="신청 인원"><option value="0">인원</option><option value="1">1명+</option><option value="10">10명+</option></select></span></div>
    <button class="pill toggle" id="tf" type="button" aria-pressed="false">더에프</button>
    <button class="pill toggle" id="nofull" type="button" aria-pressed="false">마감제외</button>
  </div>
</div>

<main class="wrap gutter" id="main"></main>

<script>
const LV = ["루키","비기너1","비기너2","비기너3","아마추어1","아마추어2","아마추어3","아마추어4","아마추어5","세미프로1","세미프로2","세미프로3","프로"];
const short = (l) => (l || "").replace("아마추어", "아마").replace("세미프로", "세미");
const WD = ["일","월","화","수","목","금","토"];
const KEY = "plab-radar-board-v1";
// my: 내 레벨 (초록 표시 기준, 아마3 = 6)
let prefs = { v: 2, from: "10:00", to: "17:00", date: "", my: 6, sort: "rec", aiOnly: false, only6: false, onlyTF: false, minPeople: 0, hideFull: true };
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  if (!saved.v) delete saved.hideFull; // v2부터 '마감 제외'가 기본값
  Object.assign(prefs, saved, { v: 2 });
} catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const times = []; for (let h = 0; h < 24; h++) times.push(String(h).padStart(2, "0") + ":00"); times.push("23:59");
const hourNum = (t) => (t === "23:59" ? "24" : String(Number(t.slice(0, 2))));
for (const t of times) { $("from").append(new Option(hourNum(t), t)); $("to").append(new Option(hourNum(t) + "시", t)); }
$("from").value = prefs.from; $("to").value = prefs.to; $("sort").value = prefs.sort;
$("ai").setAttribute("aria-pressed", String(prefs.aiOnly));
$("nofull").setAttribute("aria-pressed", String(prefs.hideFull));
$("v6").setAttribute("aria-pressed", String(prefs.only6));
$("tf").setAttribute("aria-pressed", String(prefs.onlyTF));
if (prefs.only10) { prefs.minPeople = 10; delete prefs.only10; } // 예전 '10명+' 버튼 설정 이어받기
$("minp").value = String(prefs.minPeople);
$("minp-pill").classList.toggle("on", prefs.minPeople > 0);

function kstToday() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function dday(iso) {
  if (!iso) return "";
  const ms = Date.parse(iso) - Date.now();
  if (ms <= 0) return "마감";
  const h = Math.floor(ms / 3600e3);
  // 하루 이상 남았으면 모든 카드가 같아서 표시 안 함 (경기 당일에만 의미 있음)
  return h >= 24 ? "" : h >= 1 ? `마감 ${h}시간 전` : `마감 ${Math.ceil(ms / 60e3)}분 전`;
}
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60e3);
  return m < 1 ? "방금 갱신" : m < 60 ? `${m}분 전 갱신` : `${Math.round(m / 60)}시간 전 갱신`;
}

// 이 화면의 버전 (서버가 배포 때 채움). 서버 버전과 다르면 새 화면 코드를 받으러 새로고침
const BUILD = "__BUILD__";
function checkBuild(res) {
  const b = res.headers.get("x-build");
  if (!b || b === BUILD || document.querySelector(".sheet-bg")) return; // 팝업을 보는 중이면 다음 기회에
  try { if (sessionStorage.getItem("reloaded-for") === b) return; sessionStorage.setItem("reloaded-for", b); } catch (e) {}
  location.reload();
}
async function api(path) {
  const res = await fetch(path);
  checkBuild(res);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function renderDates(dates) {
  const today = kstToday();
  const list = dates.filter((d) => d.date >= today);
  if (!list.some((d) => d.date === prefs.date)) {
    const sun = list.find((d) => new Date(d.date + "T00:00:00Z").getUTCDay() === 0);
    prefs.date = (sun || list[0] || { date: today }).date;
  }
  $("dates").innerHTML = list.map((d) => {
    const dt = new Date(d.date + "T00:00:00Z"); const w = dt.getUTCDay();
    return `<button class="date${w === 6 ? " sat" : w === 0 ? " sun" : ""}" type="button" role="tab" data-date="${d.date}" aria-pressed="${d.date === prefs.date}">
      <b>${dt.getUTCDate()}</b><span>${d.date === today ? "오늘" : WD[w]}</span></button>`;
  }).join("");
  const sel = $("dates").querySelector('[aria-pressed="true"]'); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

const TIER_SVG = {
  high: `<svg viewBox="0 0 10 10"><path d="M5 1 9.5 9h-9z"/></svg>`,
  low: `<svg viewBox="0 0 10 10"><path d="M5 9 .5 1h9z"/></svg>`,
  mid: `<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6"/></svg>`,
};
function levelHtml(it) {
  const e = it.estimate;
  if (!e) return `<div class="lv"><span class="k" aria-label="평균 없음">–</span></div>`;
  const L = short(e.label);
  // 레벨 안 위치: ▲ 높은 쪽 · ● 가운데 · ▼ 낮은 쪽 · 모르면 표시 안 함
  const tier = it.probTier;
  const pos = tier ? { low: [TIER_SVG.low, "낮은 쪽"], mid: [TIER_SVG.mid, "가운데"], high: [TIER_SVG.high, "높은 쪽"] }[tier] : null;
  // 초록: 내 레벨보다 낮거나, 내 레벨과 같은데 높은 쪽이 아닌 매치만
  const good = it.atOrBelowMine;

  return `<div class="lv"><b class="lvname${good ? " good" : ""}">${esc(L)}</b>${pos ? `<span class="tier ${tier}" role="img" aria-label="${esc(L)} 중 ${pos[1]}" title="${esc(L)} 중 ${pos[1]}">${pos[0]}</span>` : ""}</div>`;
}
function rowHtml(it) {
  const status = it.full ? ["full", "마감"] : it.closingSoon ? ["hurry", "마감임박"] : ["available", "신청가능"];
  const tags = [
    `<span class="${it.is6v6 ? "on" : ""}">${esc((it.format || "").replace(/\s/g, ""))}</span>`,
    it.sex === 1 ? `<span>남자</span>` : `<span>남녀 모두</span>`,
  ].filter(Boolean).join(`<span class="dot">·</span>`) + (it.aiReport ? `<span class="badge ai">AI리포트</span>` : "");
  // 카드를 누르면 레벨 상세 팝업, 오른쪽 신청 버튼만 플랩으로
  return `<li><div class="row${it.full ? " full" : ""}" data-id="${it.id}" role="button" tabindex="0" aria-label="${esc(it.time)} ${esc(it.title)} 레벨 상세">
    <div class="time"><span>${esc(it.time)}${(() => { const d = it.full ? "" : dday(it.deadlineAt); return d ? `<small>${esc(d)}</small>` : ""; })()}</span>${levelHtml(it)}</div>
    <div class="body">
      <div class="title">${esc(it.title)}<span class="chev" aria-hidden="true">›</span></div>
      <div class="tags">${tags}</div>
      <div class="ppl${it.closingSoon ? " hot" : it.enoughPlayers ? " enough" : ""}"><span class="bar" aria-hidden="true"><i style="width:${it.max ? Math.min(100, Math.round((it.confirm / it.max) * 100)) : 0}%"></i></span>신청 ${it.confirm}/${it.max ?? "?"}명</div>
    </div>
    ${it.full ? `<span class="status full">마감</span>` : `<a class="status ${status[0]}" href="${esc(it.url)}" target="_blank" rel="noopener" aria-label="플랩에서 ${status[1]} 매치 열기">${status[1]}<svg class="ext" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2 3 9"/></svg></a>`}</div></li>`;
}

let last = null;
// 유력 평균(점)이 레벨 구간 3칸 중 어디에 있는지: 0 낮음 · 1 가운데 · 2 높음
// 칸 경계는 화면 표기(아마3.x의 x, 내림)에 맞춤: .0~.2 낮음 · .3~.6 가운데 · .7~.9 높음
const thirdOfDigit = (x01) => { const dg = Math.min(9, Math.max(0, Math.floor(x01 * 10 + 1e-9))); return dg <= 2 ? 0 : dg <= 6 ? 1 : 2; };
const meanThird = (mean, lo, hi) => thirdOfDigit((mean - lo) / (hi - lo));
// 목록 아이콘(레벨 안 위치) = 팝업 게이지의 점(유력 평균)이 있는 칸
function addProbTiers(data) {
  if (data._prob) return;
  data._prob = true;
  for (const it of data.items) {
    it.probTier = null; it.pbucket = 99;
    const e = it.estimate; if (!e) continue;
    it.pbucket = e.labelNum * 3 + 1;
    if (!it.dist || !data.prior) continue;
    const r = levelDist({ prior: data.prior, ...it.dist, bandLo: e.bandLo, bandHi: e.bandHi }, true);
    if (!r) continue;
    const k = meanThird(r.mode, e.bandLo, e.bandHi);
    it.pbucket = e.labelNum * 3 + k;
    it.probTier = ["low", "mid", "high"][k];
  }
  // 추천순: 서버와 같은 순서인데, 같은 시각 안의 레벨 칸만 확률 기준으로
  data.items.sort((a, b) =>
    Number(b.atOrBelowMine) - Number(a.atOrBelowMine) || Number(b.closingSoon) - Number(a.closingSoon) ||
    a.time.localeCompare(b.time) || a.pbucket - b.pbucket || Number(b.is6v6) - Number(a.is6v6) ||
    Number(b.enoughPlayers) - Number(a.enoughPlayers) || a.id - b.id);
}
function render(data) {
  last = data;
  addProbTiers(data);
  $("updated").textContent = ago(data.updated_at);
  renderDates(data.dates);
  // 추천순은 서버 정렬 그대로, 시간순은 시작 시각 → 구장명
  const base = data.items.filter((x) => (!prefs.aiOnly || x.aiReport) && (!prefs.only6 || x.is6v6) && (!prefs.onlyTF || x.title.includes("더에프필드")) && x.confirm >= prefs.minPeople && (!prefs.hideFull || !x.full));
  const items = prefs.sort === "time"
    ? [...base].sort((a, b) => a.time.localeCompare(b.time) || a.title.localeCompare(b.title))
    : base;
  if (!items.length) {
    const filtered = prefs.aiOnly || prefs.only6 || prefs.onlyTF || prefs.minPeople > 0 || (prefs.hideFull && data.items.length > 0);
    $("main").innerHTML = HELP + `<div class="empty">이 날짜·시간대에 조건에 맞는 매치가 없어요.${filtered ? `<br><button class="retry" id="clear-filters" type="button">필터 끄기</button>` : ""}</div>`;
    const h0 = $("help"); h0.open = helpOpen; h0.ontoggle = () => { helpOpen = h0.open; };
    if (filtered) $("clear-filters").onclick = clearFilters;
    return;
  }
  $("main").innerHTML =
    (prefs.introSeen ? "" : INTRO) +
    HELP +
    `<ul class="list">${items.map(rowHtml).join("")}</ul>`;
  const h = $("help"); h.open = helpOpen; h.ontoggle = () => { helpOpen = h.open; };
  const ok = $("intro-ok"); if (ok) ok.onclick = () => { prefs.introSeen = true; save(); $("intro").remove(); };
}
let helpOpen = false;

const tierIc = (k) => `<span class="tier-inline ${k}">${TIER_SVG[k]}</span>`;
// 첫 방문 안내 카드 (한 번 닫으면 다시 안 뜸)
const INTRO = `<section class="intro" id="intro" aria-label="처음 사용 안내">
  <h3>처음이세요? 이렇게 써요</h3>
  <ol>
    <li><b>매치를 누르면</b> 레벨 상세가 열려요. 유력 평균, 신청자 레벨 분포, 추이를 볼 수 있어요.</li>
    <li><b>신청가능 ↗</b>을 누르면 플랩 신청 화면으로 가요.</li>
    <li><b>🔔</b>을 누르면 지금 필터 조건으로 알림을 받을 수 있어요. 초록(평균 아마3 이하) 매치가 10명·마감임박이 되면 알려줘요.</li>
  </ol>
  <button class="btn small" id="intro-ok" type="button">알겠어요</button>
</section>`;
const HELP = `<details class="help" id="help"><summary>정렬 순서 · 보는 법</summary><div class="help-body">
  <h4>레벨 보는 법</h4>
  <p><b>초록 레벨</b> 평균이 아마3 이하인 매치.</p>
  <p><b>평균 레벨 (시간 아래)</b> 플랩이 보여주는 참가자 평균 레벨 (루키 제외). 플랩 내부 점수로 아마3은 2.5~2.6이고, 평균 아마3이면 평균 점수가 2.45~2.65 사이라, 화면에서는 이 범위를 아마3.0~3.9로 바꿔서 보여줘요. 아마3.5가 가운데라, 3.2면 낮은 3, 3.8이면 높은 3. 평가된 신청자가 없으면 –.</p>
  <p><b>${tierIc("high")} ${tierIc("mid")} ${tierIc("low")}</b> 그 레벨 구간을 3칸으로 나눴을 때 유력 평균(가장 가능성 높은 평균값)이 높은 쪽 / 가운데 / 낮은 쪽에 있다는 뜻 (추정). 매치를 누르면 자세히 나와요.</p>
  <p><b>아이콘 없음</b> 평가된 신청자가 없어 평균이 없는 매치.</p>
  <p><b>매치 누르기</b> 레벨 상세(유력 평균, 신청자 레벨, 추이)가 열려요. 오른쪽 <b>신청가능</b> 버튼을 누르면 플랩 신청 화면으로 가요.</p>
  <p><b>추이 그래프</b> 그 매치의 평균 레벨·신청 인원 추이를 그래프로 보여줘요. 그래프를 누르거나 밀면 그 시점 값이 나와요. 변화 기록에는 들어오고 나간 사람의 등급이 나오고, 평균 변화로 계산이 되면 세부 레벨 추정(예: 아마4~5)도 붙어요.</p>
  <h4>매치 카드</h4>
  <p><b>마감임박</b> 신청 15명 이상.</p>
  <p><b>신청 인원 막대</b> 회색 = 1~9명 (한 명만 들어와도 평균이 크게 흔들려요) · 초록 = 10~14명 · 빨강 = 15명 이상(마감임박).</p>
  <p><b>마감 3시간 전</b> 신청 마감(경기 10분 전)까지 남은 시간. 마감 24시간 이내일 때만 보여요.</p>
  <p><b>AI리포트</b> 플랩이 경기 후 AI 분석 리포트를 주는 매치.</p>
  <h4>정렬</h4>
  <p><b>추천순</b> 평균 아마3 이하(초록) 매치 먼저, 그다음 나머지. 각각 마감임박 → 이른 시각 순 (같은 시각이면 레벨 낮은 순 → 6vs6 → 신청 10명 이상).</p>
  <p><b>시간순</b> 시작 시각 순.</p>
  <h4>필터</h4>
  <p><b>인원 ▾</b> 1명+ / 10명+ 고르면 신청 인원이 그 이상인 매치만 보여요.</p>
  <p><b>AI(리포트) · 6vs6 · 더에프 버튼</b> 누르면 그 매치만 보여요 (더에프 = 영등포 더에프필드). 여러 개 켜면 모두 해당하는 매치만.</p>
  <p><b>마감 제외 버튼</b> 기본으로 켜져 있어 마감된 매치를 숨겨요. 끄면 마감 매치도 같은 순서 안에 섞여 보여요.</p>
</div></details>`;

let seq = 0;
async function load() {
  const my = ++seq;
  if (!last) $("main").innerHTML = `<p class="empty">불러오는 중…</p>`;
  try {
    let data = await api(`/api/board?date=${prefs.date || kstToday()}&from=${prefs.from}&to=${prefs.to}&my=${prefs.my}`);
    if (my !== seq) return;
    const before = prefs.date; renderDates(data.dates);
    if (prefs.date !== before) data = await api(`/api/board?date=${prefs.date}&from=${prefs.from}&to=${prefs.to}&my=${prefs.my}`);
    if (my !== seq) return;
    save(); render(data);
  } catch (e) {
    if (my !== seq) return;
    $("main").innerHTML = `<div class="empty">매치를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.<br><button class="retry" id="retry" type="button">다시 시도</button></div>`;
    $("retry").onclick = load;
  }
}

$("main").addEventListener("click", (e) => {
  if (e.target.closest("a.status")) return; // 신청 버튼은 플랩으로
  const row = e.target.closest(".row[data-id]");
  if (!row) return;
  openHistory(Number(row.dataset.id));
});
$("main").addEventListener("keydown", (e) => {
  const row = e.target.closest && e.target.closest(".row[data-id]");
  if (row && (e.key === "Enter" || e.key === " ") && !e.target.closest("a")) { e.preventDefault(); openHistory(Number(row.dataset.id)); }
});
$("dates").addEventListener("click", (e) => { const b = e.target.closest(".date"); if (!b) return; prefs.date = b.dataset.date; save(); load(); });
$("from").onchange = (e) => { prefs.from = e.target.value; if (prefs.from > prefs.to) { prefs.to = prefs.from; $("to").value = prefs.to; } save(); load(); };
$("to").onchange = (e) => { prefs.to = e.target.value; if (prefs.to < prefs.from) { prefs.from = prefs.to; $("from").value = prefs.from; } save(); load(); };
$("sort").onchange = (e) => { prefs.sort = e.target.value; save(); if (last) render(last); };

function stepChart(el, pts, t0, t1, dom, ticks, h, xTicks) {

  let d = "", area = "", open = false;
  pts.forEach((p, i) => {
    const xe = x(i + 1 < pts.length ? pts[i + 1].t : t1);
    if (p.v == null) { open = false; return; }
    d += open ? ` V${y(p.v)} H${xe}` : ` M${x(p.t)},${y(p.v)} H${xe}`;
    area += ` M${x(p.t)},${y(dom[0])} V${y(p.v)} H${xe} V${y(dom[0])} Z`;

// 플랩 점수 → '아마3.2' 같은 표기. 평균 레벨 구간(아마3 = 2.45~2.65점)의 시작을 X.0, 끝을 X.9로 (가운데 X.5)

// ---------- 레벨 분포 추정 (확률) ----------
// 재료(서버): 레벨별 비율(사전 분포, 쌓인 관측으로 계산) · 지금 등급별 인원 · 평균 기록으로 좁힌 점수 합 범위
// 1) 등급별로 "한 사람의 점수(0.1점 단위)" 확률을 만듦: 아마추어면 아마1~5 비율을 각 레벨 점수칸에 고르게
// 2) 사람을 한 명씩 더해 "점수 합" 확률을 계산 (합성곱)
// 3) 점수 합이 실제로 가능한 범위(sumLo~sumHi) 밖은 버리고 다시 합이 1이 되게 → 조건부 확률
// 4) 평균 = 점수 합 ÷ 인원, 레벨별 인원 = 한 사람씩 "이 사람이 레벨 L일 확률"을 더함

function levelDist(d, light = false) {

  const lvOf = (x) => { let L = 1; while (L < 12 && x > tenth(L)[1]) L++; return L; };
  const person = {};

  //   (예: 1명 아마1 → 2.1·2.2 반반 → 2.15, 근거 없이 한쪽으로 치우치지 않게)

  const num = (levelDecimal((d.bandLo + d.bandHi) / 2).value ?? 0) | 0;
  return `<div class="lvnow"><span class="big">${esc(decText(r.mode))}</span><span class="cap">유력 평균</span></div>
    <div class="gauge" role="img" aria-label="낮은 쪽 ${Math.round(r.third[0] * 100)}%, 가운데 ${Math.round(r.third[1] * 100)}%, 높은 쪽 ${Math.round(r.third[2] * 100)}%">
      <span class="ge">${num || ""}</span>
      <span class="gt">${r.third.map((p, i) => i === top ? `<i class="top"></i>` : `<i style="opacity:${(0.1 + 0.5 * p).toFixed(2)}"></i>`).join("")}<b style="left:${pos.toFixed(1)}%"></b></span>
      <span class="ge">${num ? num + 1 : ""}</span>
      <span></span><span class="gl">${["낮음", "가운데", "높음"].map((n, i) => i === top ? `<b>${n}</b>` : `<span>${n}</span>`).join("")}</span><span></span>
    </div>`;
}

// ② 신청자 레벨: 한 사람당 칩 하나로 "가장 유력한 구성"
//   사람마다 따로 유력한 레벨을 고르면 서로 안 맞는 조합이 섞일 수 있음
//   (예: 비기너는 "비기너1 + 아마추어 높음" 시나리오에서, 아마추어는 "비기너3 + 아마추어 낮음" 시나리오에서 가져옴)
//   → 등급별 레벨 인원 조합 전체를 한 덩어리로 비교해서 확률이 가장 높은 것을 고름
//   구성 확률 ∝ (사전 비율로 그 구성이 나올 확률) × (그 구성일 때 점수 합이 기록 범위에 들어갈 확률)
const LOGF = [0]; for (let i = 1; i <= 80; i++) LOGF[i] = LOGF[i - 1] + Math.log(i);
function composition(k, exp) { // 기대 인원을 정수로 (큰 나머지 순) — 근사 탐색의 출발점
  const fl = exp.map((e) => Math.floor(e + 1e-9));
  let left = k - fl.reduce((a, b) => a + b, 0);
  exp.map((e, i) => [e - fl[i], i]).sort((x, y) => y[0] - x[0]).forEach(([, i]) => { if (left > 0) { fl[i]++; left--; } });
  return fl;
}
function bestComposition(d, r) {
  const tenth = (L) => [Math.round(SCORE_BANDS[L][0] * 10), Math.round(SCORE_BANDS[L][1] * 10)];
  const grades = Object.entries(GRADE_LV).filter(([g]) => d.counts[g] > 0).map(([g, [a, b]]) => {
    const lv = []; for (let l = a; l <= b; l++) lv.push(l);
    const z = lv.reduce((t, l) => t + d.prior[l], 0);
    return { g, k: d.counts[g], lv, lw: lv.map((l) => Math.log(d.prior[l] / z)) };
  });
  // n명이 모두 레벨 L일 때 점수 합 분포 (레벨 안 점수는 고르게), 시작값 off
  const cache = new Map();
  const block = (L, n) => {
    const key = L * 100 + n; if (cache.has(key)) return cache.get(key);
    const [lo, hi] = tenth(L), w = hi - lo + 1;
    let arr = [1];
    for (let i = 0; i < n; i++) { const nx = new Array(arr.length + w - 1).fill(0); arr.forEach((p, s) => { for (let j = 0; j < w; j++) nx[s + j] += p / w; }); arr = nx; }
    const v = { off: lo * n, arr }; cache.set(key, v); return v;
  };
  const conv = (A, Bk) => { const out = new Array(A.arr.length + Bk.arr.length - 1).fill(0); A.arr.forEach((p, i) => { if (p) Bk.arr.forEach((q, j) => { out[i + j] += p * q; }); }); return { off: A.off + Bk.off, arr: out }; };
  const inRange = (D) => { let t = 0; for (let s = Math.max(d.sumLo, D.off); s <= d.sumHi && s - D.off < D.arr.length; s++) t += D.arr[s - D.off]; return t; };
  const priorLog = (counts) => grades.reduce((t, G, gi) => t + LOGF[G.k] + counts[gi].reduce((u, n, li) => u - LOGF[n] + n * G.lw[li], 0), 0);
  const score = (counts) => {
    let D = { off: 0, arr: [1] };
    grades.forEach((G, gi) => counts[gi].forEach((n, li) => { if (n) D = conv(D, block(G.lv[li], n)); }));
    const p = inRange(D); return p > 0 ? priorLog(counts) + Math.log(p) : -Infinity;
  };
  const choose = (n, k) => { let x = 1; for (let i = 1; i <= k; i++) x = (x * (n - k + i)) / i; return x; };
  const total = grades.reduce((t, G) => t * choose(G.k + G.lv.length - 1, G.lv.length - 1), 1);
  let best = null, bestS = -Infinity;
  if (total <= 6000) {
    // 전부 따져보기: 등급·레벨 순서로 인원을 정하며 점수 합 분포를 이어 붙임 (앞부분 계산은 공유)
    const counts = grades.map((G) => G.lv.map(() => 0));
    const dfs = (gi, li, left, D) => {
      if (gi === grades.length) { const p = inRange(D); if (p > 0) { const sc = priorLog(counts) + Math.log(p); if (sc > bestS) { bestS = sc; best = counts.map((c) => c.slice()); } } return; }
      const G = grades[gi], last = li === G.lv.length - 1;
      for (let n = last ? left : 0; n <= left; n++) {
        counts[gi][li] = n;
        const D2 = n ? conv(D, block(G.lv[li], n)) : D;
        if (last) dfs(gi + 1, 0, gi + 1 < grades.length ? grades[gi + 1].k : 0, D2); else dfs(gi, li + 1, left - n, D2);
      }
      counts[gi][li] = 0;
    };
    dfs(0, 0, grades[0].k, { off: 0, arr: [1] });
  } else {
    // 너무 많으면: 기대 인원에서 출발해 한 명씩 레벨을 옮겨 보며 확률이 오르는 쪽으로 (언덕 오르기)
    best = grades.map((G) => composition(G.k, G.lv.map((l) => r.expect[l])));
    bestS = score(best);
    for (let round = 0; round < 60; round++) {
      let moved = null, movedS = bestS;
      grades.forEach((G, gi) => G.lv.forEach((_, a) => { if (!best[gi][a]) return; G.lv.forEach((__, b) => {
        if (a === b) return; const c = best.map((x) => x.slice()); c[gi][a]--; c[gi][b]++;
        const sc = score(c); if (sc > movedS + 1e-12) { movedS = sc; moved = c; }
      }); }));
      if (!moved) break; best = moved; bestS = movedS;
    }
  }
  if (!best) return null;
  return { grades, counts: best, prob: Math.exp(bestS) / r.Z, exact: total <= 6000 };
}
const GRADE_CLASS = { beginner: "g-b", amateur: "g-a", semipro: "g-s", pro: "g-p" };
function peopleHtml(d, r) {
  if (!r) return d && d.counts.rookie ? `<p class="note">루키 ${d.counts.rookie}명 (평균에서 빠져요)</p>` : "";
  const grades = Object.entries(GRADE_LV).filter(([g]) => d.counts[g] > 0);
  const bc = bestComposition(d, r);
  // 레벨별 인원 막대그래프: 가장 낮은~높은 레벨 사이를 빈칸 없이 이어서 (0명 칸도 자리 유지)
  const per = Array(13).fill(0), gradeOf = [];
  if (bc) bc.grades.forEach((G, gi) => G.lv.forEach((l, li) => { per[l] += bc.counts[gi][li]; gradeOf[l] = G.g; }));
  const used = per.map((n, l) => (n ? l : 0)).filter(Boolean);
  const lo = Math.min(...used), hi = Math.max(...used);
  const rk = d.counts.rookie || 0;
  const maxN = Math.max(rk, ...per);
  // 라임 = 유력 평균이 있는 레벨 (위 '지금 레벨'과 연결)
  let avgL = 1; while (avgL < 12 && r.mode * 10 >= Math.round(SCORE_BANDS[avgL][1] * 10) + 0.5) avgL++;
  const col = (cls, n, label) => `<li class="${cls}"><span class="hc">${n ? `<span class="hn">${n}</span><span class="hb" style="height:${Math.max(10, (n / maxN) * 100)}%"></span>` : cls.includes("avg") ? `<span class="hb stub"></span>` : ""}</span><span class="hl">${esc(label)}</span></li>`;
  const cols = [];
  if (rk) cols.push(col("g-r", rk, "루키"));
  for (let l = Math.min(lo, avgL); l <= Math.max(hi, avgL); l++) {
    const g = gradeOf[l] || Object.entries(GRADE_LV).find(([, [a, b]]) => l >= a && l <= b)[0];
    cols.push(col(`${GRADE_CLASS[g]}${l === avgL ? " avg" : ""}`, per[l], hi - lo >= 8 ? short(LV[l]).replace(/^비기너/, "비") : short(LV[l])));
  }
  const chips = [`<ul class="hist-lv">${cols.join("")}</ul>`];
  const pct = bc ? Math.round(bc.prob * 100) : 0;
  const note = bc ? `가장 유력한 구성 · ${pct >= 1 ? pct + "%" : "1% 미만"}` : "";
  const share = (g, l) => r.expect[l] / d.counts[g];
  const detail = grades.map(([g, [a, b]]) => {
    const cells = []; for (let l = a; l <= b; l++) cells.push(l);
    return `<li><span class="gn">${GRADE_KO_SHORT[g]} <b>${d.counts[g]}명</b></span><span class="cells">${cells.map((l) => {
      const p = share(g, l);
      const al = 0.08 + 0.5 * Math.min(1, p / 0.6); // 라임 진하기 최대 0.58 (쨍하지 않게)
      return `<span class="cell${al > 0.4 ? " hi" : ""}"><i style="opacity:${al.toFixed(2)}"></i><em>${Math.round(p * 100)}%</em><small>${esc(short(LV[l]).replace(/^(비기너|아마|세미)/, ""))}</small></span>`;
    }).join("")}</span></li>`;
  }).join("");
  return `${chips.join("")}
    <p class="hint">${note}${d.counts.rookie ? " · 루키는 평균 제외" : ""}</p>
    <details class="pdetail"><summary>레벨별 확률 자세히</summary>
      <ul class="heat">${detail}</ul>
      <p class="hint">한 사람이 그 레벨일 확률</p>
    </details>`;
}

async function openHistory(id) {
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet hist" role="dialog" aria-modal="true" aria-labelledby="hist-title"><p class="note">불러오는 중…</p></div>`;
  document.body.append(bg);
  bg.addEventListener("click", (e) => { if (e.target === bg) bg.remove(); });
  let data;
  try { data = await (await fetch(`/api/matches/${id}/history`)).json(); } catch (e) { data = null; }
  const sheet = bg.firstElementChild;
  if (!data || !data.match) { sheet.innerHTML = `<p class="note">추이를 불러오지 못했어요.</p><button class="btn sub" type="button">닫기</button>`; sheet.querySelector("button").onclick = () => bg.remove(); return; }
  const m = data.match, snaps = data.snapshots;
  const pts = snaps.map((s) => ({ t: Date.parse(s.ts), lv: lvNum(s.average_level), n: s.confirm, label: s.average_level, ts: s.ts, changes: s.changes || [], person: s.person }));
  const start = Date.parse(`${m.kst_date}T${m.kst_time}:00+09:00`);
  const t0 = pts.length ? pts[0].t : Date.now(), t1 = Math.max(t0 + 3600e3, Math.min(Date.now(), start));
  const e = data.estimate;
  // 아마추어 레벨일 때만 '아마 2.6~3.1'처럼 소수로 보여줌 (범위가 레벨 하나보다 좁을 때)
  // 추정 평균을 '아마3.2~3.4'처럼 보여줌 (범위가 레벨 구간보다 좁을 때만)
  const range = e && e.hi - e.lo < (e.bandHi - e.bandLo) * 0.99 ? ` (추정평균 ${levelRangeText(e.lo, e.hi)})` : "";
  const nowLv = m.average_level && m.average_level !== "루키" ? short(m.average_level) : null;
  const dr = data.dist ? levelDist(data.dist) : null;
  sheet.innerHTML = `
    <div class="hist-head"><h2 id="hist-title">${esc(m.title)}</h2><button class="x-btn" id="hist-x" type="button" aria-label="닫기"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <span class="sub">${esc(fmtDate(m.kst_date))} ${esc(m.kst_time)} · 신청 ${m.confirm ?? 0}/${m.max_players ?? "?"}명</span></div>
    <div class="hist-body">
    <section class="blk"><h3 class="bh">지금 레벨 <span class="tag">추정</span></h3>${nowLevelHtml(data.dist, dr)}</section>
    ${dr || (data.dist && data.dist.counts.rookie) ? `<section class="blk"><h3 class="bh">신청자 레벨 <span class="tag">추정</span></h3>${peopleHtml(data.dist, dr)}</section>` : ""}
    <section class="blk"><h3 class="bh">변화 추이</h3>
    ${pts.length < 2 ? `<p class="note">아직 변화 기록이 ${pts.length ? "1건" : "없어요"}이라 추이를 그릴 수 없어요.</p>` : `
    <div class="chart"><div class="chart-top"><h3>평균 레벨</h3><span class="readout" id="readout" aria-live="polite"></span></div><div id="c-lv"></div></div>
    <div class="chart"><h3>신청 인원</h3><div id="c-n" data-area="1"></div></div>`}
    </section>
    ${pts.length ? `<details class="hist-log"><summary>상세 이력 ${pts.length}건</summary><ul class="log" aria-label="변화 기록">${[...pts].reverse().slice(0, 60).map((p, i, arr) => {
      const prev = arr[i + 1];
      return `<li><span>${fmtTsShort(p.ts)}</span><span class="${prev && prev.n !== p.n ? "chg" : ""}">${p.n}명</span><span class="${prev && prev.label !== p.label ? "chg" : ""}">${p.lv == null ? "–" : esc(short(p.label))}</span>${whoHtml(p)}</li>`;
    }).join("")}</ul></details>` : ""}
    </div>
    <div class="hist-foot"><button class="btn sub" id="hist-close" type="button">닫기</button></div>`;
  $("hist-close").onclick = () => bg.remove();
  $("hist-x").onclick = () => bg.remove();
  if (pts.length < 2) return;

  // 평균 레벨: 데이터 범위 ±1 정수 레벨
  const lvs = pts.map((p) => p.lv).filter((v) => v != null);
  const hasLv = lvs.length > 0; // 평균이 한 번도 없었으면(루키만/0명) 레벨 그래프 대신 안내
  const lo = hasLv ? Math.max(1, Math.min(...lvs) - 1) : 5, hi = hasLv ? Math.min(12, Math.max(...lvs) + 1) : 7;
  const lvTicks = []; for (let v = lo; v <= hi; v++) lvTicks.push([v, esc(short(LV[v]))]);
  const maxN = Math.max(1, m.max_players || 0, ...pts.map((p) => p.n));
  const nTicks = [[0, "0"], [10, "10"], [maxN, String(maxN)]].filter((t, i, a) => t[0] <= maxN && a.findIndex((u) => u[0] === t[0]) === i);
  // x 눈금: 기간에 맞춰 1·2·3·6·12시간 / 1·2일 간격 중 5개 이하가 되는 가장 촘촘한 것. 자정은 날짜, 그 외는 'N시'
  const HOUR = 3600e3, KST = 9 * HOUR;
  const stepH = [1, 2, 3, 6, 12, 24, 48].find((h) => (t1 - t0) / (h * HOUR) <= 5) || 96;
  const xt = [];
  for (let t = Math.ceil((t0 + KST) / (stepH * HOUR)) * stepH * HOUR - KST; t <= t1; t += stepH * HOUR) {
    const d = kst(new Date(t).toISOString()), h = d.getUTCHours();
    xt.push([t, h === 0 ? `${d.getUTCMonth() + 1}/${d.getUTCDate()}` : `${h}시`, h === 0]);
  }
  // 눈금이 시간 단위인데 자정이 하나도 없으면 첫 눈금에 날짜를 붙임
  if (stepH < 24 && xt.length && !xt.some((x) => x[2])) { const d = kst(new Date(xt[0][0]).toISOString()); xt[0][1] = `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${xt[0][1]}`; }
  $("c-lv")._vt = xt; $("c-n")._vt = xt;
  if (!hasLv) $("c-lv").outerHTML = `<p class="note">아직 평가된 신청자가 없어 평균이 없어요.</p>`;
  const A = !hasLv ? null : stepChart($("c-lv"), pts.map((p) => ({ t: p.t, v: p.lv })), t0, t1, [lo, hi], lvTicks, 130, null);
  const B = stepChart($("c-n"), pts.map((p) => ({ t: p.t, v: p.n })), t0, t1, [0, maxN], nTicks, 110, xt);

  const show = (i) => {
    const p = pts[i];
    $("readout").innerHTML = `${fmtTs(p.ts)} · 신청 <b>${p.n}명</b> · 평균 <b>${p.lv == null ? "–" : esc(short(p.label))}</b>`;
    for (const [C, v] of [[A, p.lv], [B, p.n]]) {
      if (!C) continue;
      const cx = C.x(p.t);
      const cross = C.svg.querySelector(".cross"), dot = C.svg.querySelector(".dot");
      cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
      cross.style.visibility = "visible";
      dot.style.visibility = v == null ? "hidden" : "visible"; // 평균 없는 시점은 점 숨김
      if (v == null) continue;
      dot.setAttribute("cx", cx); dot.setAttribute("cy", C.y(v));
    }
  };
  const pick = (ev, C) => {
    const r = C.svg.getBoundingClientRect();
    const t = t0 + ((ev.clientX - r.left) * (C.W / r.width) - C.L) / (C.W - C.L - C.R) * (t1 - t0);
    let i = 0; while (i + 1 < pts.length && pts[i + 1].t <= t) i++;
    show(i);
  };
  for (const C of [A, B].filter(Boolean)) {
    C.svg.addEventListener("pointerdown", (ev) => pick(ev, C));
    C.svg.addEventListener("pointermove", (ev) => { if (ev.pointerType === "mouse" || ev.buttons) pick(ev, C); });
  }
}
refreshBell();
load();
</script>
