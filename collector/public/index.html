<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="플랩레이더">
<title>플랩레이더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 플랩 웹의 토큰을 따름: Pretendard, 검정 + 라임 브랜드, 연회색 바탕, 얇은 테두리 */
:root {
  --bg: #ffffff; --surface: #ffffff; --muted: #f6f7f3; --border: #eaebe5;
  --fg: #0f1729; --fg-2: #4d5563; --fg-3: #65758b;
  --brand: #a6f56f; --brand-soft: #edf9e5; --brand-text: #36701a; --black: #171717; --on-black: #ffffff;
  --blue: #1570ff; --red: #ff4029; --red-soft: #fff0ed; --sat: #1570ff; --sun: #ff4029;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #171717; --surface: #202020; --muted: #262626; --border: #2f2f2f;
  --fg: #ededed; --fg-2: #c4c4c4; --fg-3: #a0a0a0;
  --brand-soft: #20351b; --brand-text: #a6f56f; --black: #ededed; --on-black: #171717;
  --blue: #4492ff; --red: #ff6a55; --red-soft: #3a1d18; --sat: #4492ff; --sun: #ff6a55;
  color-scheme: dark } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; overflow-x: hidden; touch-action: pan-y; -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; letter-spacing: -0.01em;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 640px; margin: 0 auto }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--border) }
.bar { display: flex; align-items: center; gap: 8px; height: 52px }
.logo { font-weight: 800; font-size: 19px; letter-spacing: -0.03em; display: flex; align-items: center; gap: 6px }
.logo i { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft) }
.updated { margin-left: auto; font-size: 12px; color: var(--fg-3) }
.icon-btn { appearance: none; border: 0; background: var(--muted); color: var(--fg-2); width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer }

.dates { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px 10px; scrollbar-width: none }
.dates::-webkit-scrollbar { display: none }
.date { appearance: none; border: 0; background: transparent; color: var(--fg); min-width: 52px; padding: 6px 4px; border-radius: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font-family: inherit }
.date b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums }
.date span { font-size: 12px; color: var(--fg-3) }
.date.sat b, .date.sat span { color: var(--sat) }
.date.sun b, .date.sun span { color: var(--sun) }
.date[aria-pressed="true"] { background: var(--black) }
.date[aria-pressed="true"] b, .date[aria-pressed="true"] span { color: var(--on-black) }

.filters { display: flex; gap: 6px; align-items: center; padding-block: 0 10px; flex-wrap: nowrap }
.pill { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); font-size: 13px; color: var(--fg-3); white-space: nowrap; flex: none }
.pill { cursor: pointer }
.pill .k { font-size: 12px; color: var(--fg-3); font-weight: 500 }
.sel { position: relative; display: inline-flex; align-items: center }
.sel select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--fg);
  padding: 0 13px 0 0; cursor: pointer; font-variant-numeric: tabular-nums }
.sel::after { content: "▾"; position: absolute; right: 0; pointer-events: none; font-size: 10px; color: var(--fg-3) }
.pill.level { background: var(--brand-soft); border-color: transparent; color: var(--brand-text); font-weight: 600 }
.pill.level .k { color: var(--brand-text) }
.pill.level .sel select { color: var(--brand-text) }
.pill.level .sel::after { color: var(--brand-text) }

.help { margin-top: 12px; border-radius: 12px; background: var(--muted) }
.help summary { cursor: pointer; padding: 10px 12px; font-size: 13px; font-weight: 600; color: var(--fg-2); list-style: none }
.help summary::-webkit-details-marker { display: none }
.help summary::after { content: " ▾"; color: var(--fg-3) }
.help[open] summary::after { content: " ▴" }
.help-body { padding: 0 12px 10px; font-size: 13px; color: var(--fg-2) }
.help-body p { margin: 0 0 8px }
.help-body b { color: var(--fg) }
.section { font-size: 13px; font-weight: 700; color: var(--fg-3); padding-block: 18px 6px }

ul.list { list-style: none; margin: 0; padding: 0 }
.row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit }
.row:active { background: var(--muted) }
.time { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; align-self: start; padding-top: 1px }
.time small { display: block; font-size: 11px; font-weight: 500; color: var(--fg-3); margin-top: 2px }
.body { min-width: 0; display: flex; flex-direction: column; gap: 5px }
.title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere }
.tags { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 12px; color: var(--fg-3) }
.tags .on { color: var(--fg-2); font-weight: 600 }
.tags .dot { color: var(--border) }
.badge { display: inline-block; vertical-align: 2px; margin-left: 6px; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; line-height: 1.4; white-space: nowrap }
.badge.ai { background: var(--blue); color: #ffffff }
.lv { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 13px }
.lv > * { white-space: nowrap }
.rel { font-size: 12px; color: var(--fg-3) }
.lv .k { font-size: 12px; color: var(--fg-3) }
.lv b { font-weight: 700 }
.lvname { font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: -2px }
.lvname.good { background: var(--brand-soft); color: var(--brand-text) }
.tier { font-size: 12px; color: var(--fg-3) }
.ppl { font-size: 13px; color: var(--fg-3); font-variant-numeric: tabular-nums }
.status { text-align: center; min-width: 72px; height: 34px; line-height: 34px; padding: 0 10px; border-radius: 10px; font-size: 13px; font-weight: 700; white-space: nowrap }
.status.available { background: var(--brand); color: #171717 }
.status.hurry { background: var(--red); color: #ffffff }
.status.full { background: var(--muted); color: var(--fg-3) }
.row.full .title, .row.full .time { color: var(--fg-3) }

.empty { padding: 40px 0; text-align: center; color: var(--fg-3) }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap gutter">
    <div class="bar">
      <div class="logo"><i></i>플랩레이더</div>
      <span class="updated" id="updated"></span>
      <button class="icon-btn" id="reload" type="button" aria-label="새로고침">↻</button>
    </div>
  </div>
  <div class="wrap gutter"><div class="dates" id="dates" role="tablist" aria-label="날짜"></div></div>
  <div class="wrap gutter filters">
    <div class="pill"><span class="sel"><select id="from" aria-label="시작 시간 부터"></select></span>~<span class="sel"><select id="to" aria-label="시작 시간 까지"></select></span></div>
    <label class="pill level"><span class="k">내레벨</span><span class="sel"><select id="mylevel" aria-label="내 레벨"></select></span></label>
  </div>
</header>

<main class="wrap gutter" id="main"></main>

<script>
const LV = ["루키","비기너1","비기너2","비기너3","아마추어1","아마추어2","아마추어3","아마추어4","아마추어5","세미프로1","세미프로2","세미프로3","프로"];
const short = (l) => (l || "").replace("아마추어", "아마").replace("세미프로", "세미");
const WD = ["일","월","화","수","목","금","토"];
const KEY = "plab-radar-board-v1";
let prefs = { from: "10:00", to: "17:00", date: "", my: 6 };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prefs)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const times = []; for (let h = 0; h < 24; h++) times.push(String(h).padStart(2, "0") + ":00"); times.push("23:59");
for (const id of ["from", "to"]) for (const t of times) $(id).append(new Option(t, t));
LV.forEach((l, i) => { if (i >= 1) $("mylevel").append(new Option(short(l), i)); });
$("from").value = prefs.from; $("to").value = prefs.to; $("mylevel").value = prefs.my;

function kstToday() { return new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); }
function dday(iso) {
  if (!iso) return "";
  const ms = Date.parse(iso) - Date.now();
  if (ms <= 0) return "마감";
  const h = Math.floor(ms / 3600e3);
  return h >= 24 ? `마감 D-${Math.ceil(h / 24)}` : h >= 1 ? `마감 ${h}시간 전` : `마감 ${Math.ceil(ms / 60e3)}분 전`;
}
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - Date.parse(iso)) / 60e3);
  return m < 1 ? "방금 갱신" : m < 60 ? `${m}분 전 갱신` : `${Math.round(m / 60)}시간 전 갱신`;
}

async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function renderDates(dates) {
  const today = kstToday();
  const list = dates.filter((d) => d.date >= today);
  if (!list.some((d) => d.date === prefs.date)) {
    const sun = list.find((d) => new Date(d.date + "T00:00:00Z").getUTCDay() === 0);
    prefs.date = (sun || list[0] || { date: today }).date;
  }
  $("dates").innerHTML = list.map((d) => {
    const dt = new Date(d.date + "T00:00:00Z"); const w = dt.getUTCDay();
    return `<button class="date${w === 6 ? " sat" : w === 0 ? " sun" : ""}" type="button" role="tab" data-date="${d.date}" aria-pressed="${d.date === prefs.date}">
      <b>${dt.getUTCDate()}</b><span>${d.date === today ? "오늘" : WD[w]}</span></button>`;
  }).join("");
  const sel = $("dates").querySelector('[aria-pressed="true"]'); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
}

function levelHtml(it) {
  const e = it.estimate;
  if (!e) return `<div class="lv"><span class="k">평균</span><span class="tier">아직 없음</span></div>`;
  const L = short(e.label);
  const text = !e.narrowed ? "위치 모름" : { low: "낮은 쪽", mid: "가운데", high: "높은 쪽" }[e.tier];
  // 초록: 내 레벨보다 낮거나, 내 레벨과 같은데 높은 쪽이 아닌 매치만
  const good = e.labelNum < prefs.my || (e.labelNum === prefs.my && !(e.narrowed && e.tier === "high"));

  const rel = e.labelNum < prefs.my ? "나보다 낮음" : e.labelNum > prefs.my ? "나보다 높음" : "";
  return `<div class="lv"><span class="k">평균</span><b class="lvname${good ? " good" : ""}">${esc(L)}</b><span class="tier">${text}</span>${rel ? `<span class="rel">${rel}</span>` : ""}</div>`;
}
function rowHtml(it) {
  const status = it.full ? ["full", "마감"] : it.applyStatus === "hurry" ? ["hurry", "마감임박"] : ["available", "신청가능"];
  const tags = [
    `<span class="${it.is6v6 ? "on" : ""}">${esc((it.format || "").replace(/\s/g, ""))}</span>`,
    it.sex === 1 ? `<span>남자</span>` : `<span>남녀 모두</span>`,
  ].filter(Boolean).join(`<span class="dot">·</span>`);
  return `<li><a class="row${it.full ? " full" : ""}" href="${esc(it.url)}" target="_blank" rel="noopener">
    <div class="time">${esc(it.time)}<small>${esc(it.full ? "" : dday(it.deadlineAt))}</small></div>
    <div class="body">
      <div class="title">${esc(it.title)}${it.aiReport ? `<span class="badge ai">AI리포트</span>` : ""}</div>
      <div class="tags">${tags}</div>
      ${levelHtml(it)}
      <div class="ppl${it.enoughPlayers ? "" : " thin"}">신청 ${it.confirm}/${it.max ?? "?"}명${it.enoughPlayers ? "" : " · 평균 변동 큼"}</div>
    </div>
    <div class="status ${status[0]}">${status[1]}</div></a></li>`;
}

function render(data) {
  $("updated").textContent = ago(data.updated_at);
  renderDates(data.dates);
  const open = data.items.filter((x) => !x.full), full = data.items.filter((x) => x.full);
  if (!data.items.length) { $("main").innerHTML = `<p class="empty">이 날짜·시간대에 조건에 맞는 매치가 없어요.</p>`; return; }
  $("main").innerHTML =
    HELP +
    (open.length ? `<ul class="list">${open.map(rowHtml).join("")}</ul>` : `<p class="empty">신청 가능한 매치가 없어요.</p>`) +
    (full.length ? `<div class="section">마감 ${full.length}</div><ul class="list">${full.map(rowHtml).join("")}</ul>` : "");
  const h = $("help"); h.open = helpOpen; h.ontoggle = () => { helpOpen = h.open; };
}
let helpOpen = false;

const HELP = `<details class="help" id="help"><summary>정렬 순서 · 보는 법</summary><div class="help-body">
  <p><b>정렬 순서</b> 마감임박 → 평균 레벨 낮은 순 → 6vs6·AI리포트 → 신청 10명 이상 → 이른 시각. 마감된 매치는 맨 아래.</p>
  <p><b>평균 아마3</b> 플랩이 보여주는 참가자 평균 레벨 (루키 제외, 반올림 값). 아마3이면 실제 평균은 2.5~3.5 사이.</p>
  <p><b>낮은 쪽 / 가운데 / 높은 쪽</b> 그 2.5~3.5 안에서 실제 평균이 어디쯤인지 추정한 것.
    사람이 들고 날 때 평균 표시가 바뀐 기록으로 계산해요.</p>
  <p><b>위치 모름</b> 아직 좁힐 단서가 없어서 2.5~3.5 어디든 될 수 있다는 뜻. 정렬할 땐 가운데로 쳐요.</p>
  <p><b>평균 변동 큼</b> 신청 10명 미만. 한 명만 들어와도 평균이 크게 흔들려요.</p>
  <p><b>초록 레벨</b> 평균이 내 레벨보다 낮거나 같은 매치 (같은 레벨 중 높은 쪽은 제외).</p>
  <p><b>마감 D-6</b> 신청 마감(경기 10분 전)까지 남은 기간.</p>
  <p><b>AI리포트</b> 플랩이 경기 후 AI 분석 리포트를 주는 매치.</p>
</div></details>`;

let seq = 0;
async function load() {
  const my = ++seq;
  try {
    let data = await api(`/api/board?date=${prefs.date || kstToday()}&from=${prefs.from}&to=${prefs.to}`);
    if (my !== seq) return;
    const before = prefs.date; renderDates(data.dates);
    if (prefs.date !== before) data = await api(`/api/board?date=${prefs.date}&from=${prefs.from}&to=${prefs.to}`);
    if (my !== seq) return;
    save(); render(data);
  } catch (e) {
    $("main").innerHTML = `<p class="empty">불러오지 못했어요: ${esc(e.message)}</p>`;
  }
}

$("dates").addEventListener("click", (e) => { const b = e.target.closest(".date"); if (!b) return; prefs.date = b.dataset.date; save(); load(); });
$("from").onchange = (e) => { prefs.from = e.target.value; if (prefs.from > prefs.to) { prefs.to = prefs.from; $("to").value = prefs.to; } save(); load(); };
$("to").onchange = (e) => { prefs.to = e.target.value; if (prefs.to < prefs.from) { prefs.from = prefs.to; $("from").value = prefs.from; } save(); load(); };
$("mylevel").onchange = (e) => { prefs.my = Number(e.target.value); save(); load(); };
$("reload").onclick = load;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>
